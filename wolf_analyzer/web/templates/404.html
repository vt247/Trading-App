{% extends "base.html" %}

{% block title %}404 - Not Found{% endblock %}

{% block content %}
<div class="card text-center" style="padding: 4rem 2rem;">
    <h1 style="font-size: 4rem; color: var(--warning-color);">404</h1>
    <h2 class="card-title mb-2">Page Not Found</h2>
    <p class="card-subtitle mb-3">The page you're looking for doesn't exist.</p>
    <a href="/" class="btn btn-primary">← Return to Dashboard</a>
</div>
{% endblock %}
