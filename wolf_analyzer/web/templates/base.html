<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Wolf Market Analyzer{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="/" class="logo">
                🐺 <span>Wolf Market Analyzer</span>
            </a>
            <nav class="nav">
                <a href="/" class="{% if request.path == '/' %}active{% endif %}">Dashboard</a>
                <a href="/scan" class="{% if request.path == '/scan' %}active{% endif %}">Scan</a>
                <a href="/brief" class="{% if request.path == '/brief' %}active{% endif %}">Brief</a>
                <a href="/logs" class="{% if request.path == '/logs' %}active{% endif %}">Logs</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>🐺 Wolf Market Analyzer | Trade like a wolf, not a sheep</p>
        <p style="font-size: 0.8rem; margin-top: 0.5rem;">Educational tool - Not financial advice</p>
    </footer>

    <!-- Scripts -->
    <script>
        // API base URL
        const API_BASE = '';

        // Format currency
        function formatCurrency(value) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(value);
        }

        // Format percentage
        function formatPercent(value) {
            const sign = value >= 0 ? '+' : '';
            return `${sign}${value.toFixed(2)}%`;
        }

        // Format large numbers
        function formatVolume(value) {
            if (value >= 1e9) return (value / 1e9).toFixed(2) + 'B';
            if (value >= 1e6) return (value / 1e6).toFixed(2) + 'M';
            if (value >= 1e3) return (value / 1e3).toFixed(2) + 'K';
            return value.toFixed(0);
        }

        // Show loading
        function showLoading(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading...</p></div>';
            }
        }

        // Show error
        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            if (el) {
                el.innerHTML = `<div class="card"><p style="color: var(--danger-color);">❌ Error: ${message}</p></div>`;
            }
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
